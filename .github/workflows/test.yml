# Runs the suite. Everything here is Node stdlib (node:test, node:http, global
# fetch), so there is nothing to install and no cache to warm.
#
# The suite spawns real server.js child processes on FIXED ports (see
# test/helpers/testServer.js, which throws unless given an explicit port).
# Matrix jobs get separate runners, so they cannot collide with each other;
# within a job, each test file was given a distinct port.
#
# --test-concurrency is deliberately NOT pinned here. node --test defaults it
# to the machine's CPU count, and a standard ubuntu-latest runner is 4 vCPU -
# already half of the cap that was measured on a 16-CPU workstation, so writing
# `--test-concurrency=8` here would have DOUBLED CI's concurrency on a machine
# a quarter the size, in the name of lowering it. The cap belongs in README's
# Development section, next to the machine the number was measured on.
#
# --test-timeout is what actually protects this job. Every file starts a server
# and waits up to 20s for it to answer; past a certain number of servers coming
# up at once one of them loses that race, and without a per-test deadline the
# runner then waits forever instead of failing - a job that hangs until the
# workflow timeout and says nothing about why. 120s is far above the slowest
# real test here and far below anything a human would sit through, so a stuck
# file becomes a named failure. Supported on the whole matrix (added in 20.11).
# timeout-minutes backstops it for a hang that happens outside a test.
#
# Node 20 is the floor: the tests use global fetch (18+) and node:test's
# directory discovery (20+). Action versions are pinned deliberately -- bump
# them on purpose, not by drift.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: node --test --test-timeout=120000
